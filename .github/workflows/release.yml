name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore --configuration Release

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          $rawRef = "${{ github.ref_name }}"
          $version = if ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.0" }
          Write-Host "Publishing MCmodsLoader version: $version with single-file compression..."
          dotnet publish src/MCmodsLoader.UI/MCmodsLoader.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            -p:AssemblyVersion=$version `
            -p:FileVersion=$version `
            -p:InformationalVersion=$version `
            -o publish

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/MCmodsLoader.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
