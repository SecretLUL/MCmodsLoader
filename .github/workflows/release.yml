name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore --configuration Release

      - name: Publish NativeAOT Executable
        shell: pwsh
        run: |
          $rawRef = "${{ github.ref_name }}"
          $version = if ($rawRef -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.0" }

          # The AOT link step shells out to vswhere.exe to find the MSVC linker, and
          # vswhere is not on PATH by default.
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) { $env:PATH = "$installer;$env:PATH" }

          Write-Host "Publishing MCmodsLoader version: $version as a native binary..."
          dotnet publish src/MCmodsLoader.UI/MCmodsLoader.UI.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=$version `
            -p:AssemblyVersion=$version `
            -p:FileVersion=$version `
            -p:InformationalVersion=$version `
            -o publish

          $exe = Get-Item publish/MCmodsLoader.exe
          Write-Host "Produced $($exe.Name): $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/MCmodsLoader.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
