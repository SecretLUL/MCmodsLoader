name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, so builds without an explicit version (a manual
          # run on a branch) still resolve it from the newest tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore --configuration Release

      - name: Publish NativeAOT Executable
        shell: pwsh
        run: |
          # v1.3.0-beta.1 -> Version 1.3.0-beta.1, AssemblyVersion/FileVersion 1.3.0
          # (both must be purely numeric). A ref that is not a version tag passes
          # nothing and leaves the version to Directory.Build.props.
          $rawRef = "${{ github.ref_name }}"
          $versionArgs = @()
          if ($rawRef -match '^v?((\d+\.\d+\.\d+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
            $version = $matches[1]
            $numeric = $matches[2]
            $versionArgs = @(
              "-p:Version=$version",
              "-p:AssemblyVersion=$numeric",
              "-p:FileVersion=$numeric",
              "-p:InformationalVersion=$version"
            )
            Write-Host "Publishing MCmodsLoader version: $version as a native binary..."
          } else {
            Write-Host "'$rawRef' is not a version tag; the version comes from the newest Git tag."
          }

          # The AOT link step shells out to vswhere.exe to find the MSVC linker, and
          # vswhere is not on PATH by default.
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) { $env:PATH = "$installer;$env:PATH" }

          dotnet publish src/MCmodsLoader.UI/MCmodsLoader.UI.csproj `
            -c Release `
            -r win-x64 `
            @versionArgs `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-Item publish/MCmodsLoader.exe
          Write-Host "Produced $($exe.Name): $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/MCmodsLoader.exe
          name: Release ${{ github.ref_name }}
          draft: false
          # Tags such as v1.3.0-beta.1 ship as pre-releases, which /releases/latest
          # (and therefore the self-updater) skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
